[project]
name = "sales-agent"
version = "1.0.0"
description = "Sales assistant agent prototype that uses multiple GPT agents to research a prospective account (CAP 931)"
readme = "README.md"
authors = [
    { name = "Anthony Emmanuel" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "feedparser>=6.0.14",
    "groq>=1.7.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[project.scripts]
sales-agent = "sales_agent.cli:main"
sales-agent-alerts = "sales_agent.alerts:main"
sales-agent-experiments = "sales_agent.experiments:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
